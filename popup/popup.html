<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../shared/design-system.css">
</head>
<body>
  <div class="popup dl-popup" data-theme="douyin">
    <header class="popup-header">
      <img src="../icons/icon48.png?v=5" width="30" height="30" alt="" class="popup-icon">
      <div class="popup-header-text">
        <h1 id="app-title">下载助手</h1>
        <span id="app-version" class="popup-version"></span>
      </div>
    </header>

    <main class="popup-body">
      <div id="state-loading">
        <div class="popup-detect loading">
          <span class="popup-dot pulse"></span>
          <span data-i18n="loadingPage">正在识别页面…</span>
        </div>
        <div class="popup-video-card is-loading">
          <div class="popup-cover-wrap">
            <div class="popup-sk-cover popup-shimmer"></div>
          </div>
          <div class="popup-video-meta">
            <div class="popup-video-sk">
              <span class="popup-sk-line popup-shimmer"></span>
              <span class="popup-sk-line popup-shimmer short"></span>
              <span class="popup-sk-line popup-shimmer shorter"></span>
            </div>
          </div>
        </div>
      </div>

      <div id="state-ready" class="hidden">
        <div class="popup-video-card">
          <div class="popup-cover-wrap">
            <img id="item-cover" class="popup-cover hidden" alt="">
            <div id="item-cover-ph" class="popup-cover-ph">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          <div class="popup-video-meta">
            <div id="item-title" class="video-title"></div>
            <div id="item-author" class="video-author hidden"></div>
            <div id="item-sub" class="video-sub"></div>
          </div>
        </div>
        <div id="ready-extra"></div>
        <div id="ready-quality" class="popup-section hidden">
          <div class="popup-section-head" data-i18n="quality">清晰度</div>
          <div id="quality-tags" class="popup-quality-tags"></div>
        </div>
        <ul id="ready-tips" class="popup-tips compact"></ul>
        <button id="btn-open-panel" type="button" class="popup-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          <span data-i18n="openDownloadPanel">打开下载面板</span>
        </button>
      </div>

      <div id="state-empty" class="hidden">
        <section class="popup-intro" aria-labelledby="empty-title">
          <span id="empty-detect" class="popup-status" data-i18n="guide">抖音下载指引</span>
          <h2 id="empty-title" data-i18n="openVideoFirst">请先打开抖音视频</h2>
          <p id="empty-lead" data-i18n="openVideoLead">打开单个视频页，或在搜索、推荐里点开一条后再保存。</p>
          <p id="empty-current-site" class="popup-empty-site" data-i18n="currentPageEmpty">当前页面：—</p>
        </section>
        <div id="empty-steps" class="popup-steps"></div>
        <div class="popup-note" role="note">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
          <p id="empty-note" data-i18n="personalScope">只保存当前已经能播放的公开视频、封面和合集。不支持会员、付费和直播。</p>
        </div>
        <a id="btn-go-site" class="popup-btn" href="https://www.douyin.com/" target="_blank" rel="noopener" data-i18n="openSite">打开抖音</a>
      </div>

      <div id="state-error" class="hidden">
        <div class="popup-detect error">
          <span class="popup-dot error"></span>
          <span id="error-text" data-i18n="loadingFailed">加载失败</span>
        </div>
        <div class="popup-empty-hero compact">
          <p id="error-title" class="popup-empty-title" data-i18n="cannotReadInfo">暂时无法读取视频信息</p>
          <p id="error-hint" class="popup-error-hint" data-i18n="refreshHint">请在视频页按 F5 刷新后，再点击扩展图标。</p>
        </div>
        <button id="btn-retry" type="button" class="popup-btn popup-btn-outline" data-i18n="refreshRetry">刷新并重试</button>
      </div>
    </main>
    <footer class="popup-footer">
      <nav class="popup-footer-links" aria-label="Help" data-i18n-aria-label="faq">
        <a id="popup-faq" class="popup-footer-link" href="../docs/faq.html" target="_blank" rel="noopener" data-i18n="faq">常见问题</a>
        <span class="popup-footer-sep" aria-hidden="true">·</span>
        <a id="popup-privacy" class="popup-footer-link" href="../docs/index.html" target="_blank" rel="noopener" data-i18n="privacy">隐私政策</a>
      </nav>
      <div class="popup-footer-line">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span data-i18n="personalUse">仅供个人学习。请遵守抖音平台规则。</span>
      </div>
    </footer>
  </div>
  <script src="popup-config.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
